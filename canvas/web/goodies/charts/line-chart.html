<!doctype html>
<!-- pi-canvas goodie: Area Line Chart. Original implementation. Inspired by Reacticx line-chart (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revenue Line Chart</title>
<style>
  :root { color-scheme: dark; --sans: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif;
    --ink: #f4f4f6; --ink2: rgba(244,244,246,.6); --ink3: rgba(244,244,246,.36); --line: #7b86ff; --surface: #121214; }
  html, body { margin: 0; height: 100%; background: #0a0a0b; overflow: hidden; }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; display: grid; place-items: center; }
  .card { width: min(100vw - 24px, 456px); height: min(100vh - 24px, 276px); box-sizing: border-box; padding: 16px 16px 10px; border-radius: 18px;
    background: var(--surface); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 20px 50px -20px #000; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 0 4px; }
  .lbl { font-size: 11.5px; color: var(--ink2); font-weight: 500; }
  .big { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .num { font-size: 24px; font-weight: 680; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 650; padding: 3px 6px 3px 4px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .up { color: #3ddc84; background: rgba(61,220,132,.12); } .down { color: #ff6b6b; background: rgba(255,107,107,.12); }
  .delta svg { width: 11px; height: 11px; transition: transform .3s; } .down svg { transform: rotate(180deg); }
  .tabs { display: flex; padding: 2px; border-radius: 9px; background: rgba(255,255,255,.06); position: relative; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; color: var(--ink2); font: 600 11px var(--sans); padding: 5px 9px; cursor: pointer; border-radius: 7px; transition: color .25s; }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button:focus-visible { outline: 2px solid rgba(255,255,255,.7); }
  .pill { position: absolute; top: 2px; bottom: 2px; border-radius: 7px; background: rgba(255,255,255,.12); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1); }
  @media (max-width: 400px) { .tabs button { padding: 4px 6px; } .num { font-size: 20px; } }
  .plot { flex: 1; position: relative; min-height: 0; margin-top: 6px; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; cursor: crosshair; touch-action: none; }
  .ax { font-size: 10px; fill: var(--ink3); font-variant-numeric: tabular-nums; }
  .tip { position: absolute; top: 0; pointer-events: none; padding: 6px 9px; border-radius: 8px; font-size: 11px; white-space: nowrap;
    background: rgba(30,30,34,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 8px 20px rgba(0,0,0,.4); backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
  .tip.on { opacity: 1; transform: none; }
  .tip b { display: block; font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tip span { color: var(--ink2); }
</style>
</head>
<body>
<div class="card">
  <header>
    <div><div class="lbl">Net revenue</div><div class="big"><span class="num" id="num">$0</span>
      <span class="delta up" id="delta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span id="dv">0%</span></span></div></div>
    <div class="tabs" id="tabs" role="tablist"><span class="pill" id="pill"></span></div>
  </header>
  <div class="plot" id="plot">
    <svg id="svg" aria-label="Net revenue over time" role="img">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b86ff" stop-opacity=".38"/><stop offset=".7" stop-color="#7b86ff" stop-opacity=".06"/><stop offset="1" stop-color="#7b86ff" stop-opacity="0"/></linearGradient>
        <clipPath id="clip"><rect id="clipr" x="0" y="-20" width="0" height="1000"/></clipPath>
      </defs>
      <g id="grid"></g>
      <g clip-path="url(#clip)"><path id="area" fill="url(#fill)"/><path id="ln" fill="none" stroke="#7b86ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
      <g id="xh" opacity="0"><line id="xl" stroke="rgba(255,255,255,.28)" stroke-dasharray="3 3"/><circle id="xd" r="5" fill="#7b86ff" stroke="#121214" stroke-width="2"/></g>
    </svg>
    <div class="tip" id="tip"><b id="tv"></b><span id="tl"></span></div>
  </div>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // deterministic series per range
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  function series(n, seed, start, drift, vol) {
    const r = rng(seed), out = []; let v = start;
    for (let i = 0; i < n; i++) { v += (r() - .5) * vol + drift; out.push(Math.round(v)); }
    return out;
  }
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const day = (back) => { const d = new Date(2026, 10, 5); d.setDate(d.getDate() - back); return `${MON[d.getMonth()]} ${d.getDate()}`; };
  const RANGES = [
    { k: '1W', d: series(7, 6, 1820, 22, 330), lab: i => day(6 - i), per: 'day' },
    { k: '1M', d: series(30, 21, 1480, 7, 240), lab: i => day(29 - i), per: 'day' },
    { k: '3M', d: series(13, 5, 10800, 90, 1700), lab: i => day((12 - i) * 7), per: 'week' },
    { k: '1Y', d: series(12, 14, 36000, 1500, 7800), lab: i => MON[(i + 11) % 12] + (i < 1 ? ' ’25' : ''), per: 'month' },
  ];
  const $ = id => document.getElementById(id);
  const svg = $('svg'), plot = $('plot'), tabs = $('tabs');
  const S = 64; // resample resolution for morphing
  const PAD = { l: 34, r: 6, t: 8, b: 20 };
  let W = 0, H = 0, cur = 0, shown = null, raf = 0, user = false;
  const money = v => '$' + Math.round(v).toLocaleString('en-US');
  const short = v => v >= 1000 ? '$' + (v / 1000).toFixed(Number.isInteger(v / 1000) ? 0 : 1) + 'k' : '$' + Math.round(v);

  function scale(d) {
    let lo = Math.min(...d), hi = Math.max(...d); const pad = (hi - lo) * .15 || 1; lo -= pad; hi += pad;
    const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 3))); const nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(s => (hi - lo) / s <= 4);
    lo = Math.floor(lo / nice) * nice; hi = Math.ceil(hi / nice) * nice; return { lo, hi, nice };
  }
  // Catmull-Rom resample so every range morphs through the same number of points
  const resample = d => Array.from({ length: S }, (_, i) => {
    const x = i / (S - 1) * (d.length - 1), a = Math.min(d.length - 2, Math.floor(x)), t = x - a;
    const p0 = d[Math.max(0, a - 1)], p1 = d[a], p2 = d[a + 1], p3 = d[Math.min(d.length - 1, a + 2)];
    return p1 + .5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  });
  // pixel geometry for a range (target of morph)
  function geom(ri) {
    const d = RANGES[ri].d, sc = scale(d), iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
    const y = v => PAD.t + ih * (1 - (v - sc.lo) / (sc.hi - sc.lo));
    return { sc, y, pts: resample(d).map(v => y(v)), xs: d.map((_, i) => PAD.l + iw * i / (d.length - 1)) };
  }
  // monotone cubic (Fritsch–Carlson) through evenly spaced points
  function smooth(ys) {
    const n = ys.length, dx = (W - PAD.l - PAD.r) / (n - 1), xs = ys.map((_, i) => PAD.l + i * dx);
    const m = [], dl = []; for (let i = 0; i < n - 1; i++) dl.push((ys[i + 1] - ys[i]) / dx);
    m[0] = dl[0]; m[n - 1] = dl[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = dl[i - 1] * dl[i] <= 0 ? 0 : 2 / (1 / dl[i - 1] + 1 / dl[i]);
    let p = `M${xs[0]},${ys[0]}`;
    for (let i = 0; i < n - 1; i++) p += `C${xs[i] + dx / 3},${ys[i] + m[i] * dx / 3} ${xs[i + 1] - dx / 3},${ys[i + 1] - m[i + 1] * dx / 3} ${xs[i + 1]},${ys[i + 1]}`;
    return p;
  }
  function paint(ys) {
    const p = smooth(ys); $('ln').setAttribute('d', p);
    $('area').setAttribute('d', `${p}L${W - PAD.r},${H - PAD.b}L${PAD.l},${H - PAD.b}Z`);
  }
  function axes(ri) {
    const g = $('grid'), G = geom(ri), { lo, hi, nice } = G.sc, d = RANGES[ri].d;
    let s = '';
    for (let v = lo; v <= hi + 1e-6; v += nice) { const y = G.y(v).toFixed(1); s += `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${v === lo ? .14 : .06})"/><text class="ax" x="${PAD.l - 8}" y="${+y + 3}" text-anchor="end">${short(v)}</text>`; }
    const n = d.length, ticks = [0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1];
    ticks.forEach((i, k) => s += `<text class="ax" x="${G.xs[i]}" y="${H - 4}" text-anchor="${k === 0 ? 'start' : k === 3 ? 'end' : 'middle'}">${RANGES[ri].lab(i)}</text>`);
    g.innerHTML = s;
  }
  function header(ri, animate) {
    const d = RANGES[ri].d, total = d.reduce((a, b) => a + b, 0), ch = (d[d.length - 1] - d[0]) / d[0] * 100;
    const num = $('num'), from = parseFloat(num.dataset.v || 0); num.dataset.v = total;
    const t0 = performance.now();
    const run = now => { const t = animate ? Math.max(0, Math.min(1, (now - t0) / 700)) : 1, k = 1 - Math.pow(1 - t, 3); num.textContent = money(from + (total - from) * k); if (t < 1) requestAnimationFrame(run); };
    requestAnimationFrame(run);
    $('delta').className = 'delta ' + (ch >= 0 ? 'up' : 'down'); $('dv').textContent = (ch >= 0 ? '+' : '') + ch.toFixed(1) + '%';
  }
  function select(ri, animate = !reduce) {
    cur = ri;
    [...tabs.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-selected', i === ri));
    const b = tabs.querySelectorAll('button')[ri]; $('pill').style.left = b.offsetLeft + 'px'; $('pill').style.width = b.offsetWidth + 'px';
    axes(ri); header(ri, animate); hideTip();
    const to = geom(ri).pts, from = shown || to.map(() => H - PAD.b), t0 = performance.now();
    cancelAnimationFrame(raf);
    const step = now => {
      const t = animate ? Math.max(0, Math.min(1, (now - t0) / 650)) : 1, k = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      shown = from.map((v, i) => v + (to[i] - v) * k); paint(shown);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function resize() {
    W = plot.clientWidth; H = plot.clientHeight; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    shown = geom(cur).pts; paint(shown); axes(cur);
  }
  // crosshair + tooltip snapped to real data points
  const tip = $('tip');
  function hideTip() { $('xh').setAttribute('opacity', 0); tip.classList.remove('on'); }
  function hover(clientX) {
    const r = svg.getBoundingClientRect(), x = clientX - r.left, G = geom(cur), d = RANGES[cur].d;
    const i = Math.max(0, Math.min(d.length - 1, Math.round((x - PAD.l) / (W - PAD.l - PAD.r) * (d.length - 1))));
    const px = G.xs[i], py = G.y(d[i]);
    $('xl').setAttribute('x1', px); $('xl').setAttribute('x2', px); $('xl').setAttribute('y1', PAD.t); $('xl').setAttribute('y2', H - PAD.b);
    $('xd').setAttribute('cx', px); $('xd').setAttribute('cy', py); $('xh').setAttribute('opacity', 1);
    $('tv').textContent = money(d[i]); $('tl').textContent = `${RANGES[cur].lab(i)} · per ${RANGES[cur].per}`;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + 'px';
    tip.style.top = Math.max(-6, py - th - 14) + 'px'; tip.classList.add('on');
  }
  const stop = () => { user = true; clearInterval(timer); };
  svg.addEventListener('pointermove', e => { if (!e.movementX && !e.movementY && !user) return; stop(); hover(e.clientX); });
  svg.addEventListener('pointerdown', e => { stop(); hover(e.clientX); });
  svg.addEventListener('pointerleave', hideTip);

  RANGES.forEach((r, i) => {
    const b = document.createElement('button'); b.textContent = r.k; b.setAttribute('role', 'tab');
    b.onclick = () => { stop(); select(i); }; tabs.appendChild(b);
  });
  addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { stop(); select((cur + (e.key === 'ArrowRight' ? 1 : 3)) % 4); } });
  addEventListener('resize', resize);

  W = plot.clientWidth; H = plot.clientHeight; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  select(1, false);
  // draw-in reveal
  const cr = $('clipr');
  if (reduce) cr.setAttribute('width', 99999);
  else { const t0 = performance.now(); const go = now => { const t = Math.max(0, Math.min(1, (now - t0) / 1200)), k = 1 - Math.pow(1 - t, 3); cr.setAttribute('width', k * W + (t >= 1 ? 99999 : 0)); if (t < 1) requestAnimationFrame(go); }; requestAnimationFrame(go); }
  var timer = reduce ? 0 : setInterval(() => select((cur + 1) % 4), 3200);
})();
</script>
</body>
</html>
