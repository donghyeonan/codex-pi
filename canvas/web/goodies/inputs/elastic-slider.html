<!doctype html>
<!-- pi-canvas goodie: Elastic Slider. Original implementation. Inspired by Reacticx elastic-slider (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elastic Slider</title>
<style>
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(80% 70% at 50% 40%,#141417 0%,#0a0a0b 75%);
    display:grid;place-items:center;overflow:hidden;color:#ececef;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:none;
  }
  .wrap{width:min(340px,calc(100vw - 40px))}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
  .head .t{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .head .t small{display:block;font-size:12px;font-weight:400;color:#7f7e88;margin-top:3px}
  .head .v{font:600 22px/1 ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .head .v span{color:#6f6e78;font-size:14px;margin-left:1px}
  .row{display:flex;align-items:center;gap:14px}
  .ico{width:20px;height:20px;flex:none;color:#8e8d97;transition:color .3s}
  .row.active .ico{color:#d6d5dc}
  .slider{position:relative;flex:1;height:40px;cursor:grab;outline:none;touch-action:none}
  .slider:active{cursor:grabbing}
  .track{position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);will-change:transform;transition:height .25s,margin .25s}
  .row.active .track{height:18px;margin-top:-9px}
  .slider:focus-visible .track{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;border-radius:inherit;
    background:linear-gradient(90deg,#c8c6d4,#ffffff)}
  .bub{position:absolute;bottom:calc(50% + 18px);left:0;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
    padding:5px 9px;border-radius:9px;background:#fff;color:#0b0b0d;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.8);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
  .bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
  .row.active .bub{opacity:1;transform:translateX(-50%) scale(1)}
  .ticks{display:flex;justify-content:space-between;margin:12px 34px 0;font-size:11px;color:#55545d;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){.track,.bub,.ico{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="t">Volume<small>Studio Display Speakers</small></div>
    <div class="v" id="val">62<span>%</span></div>
  </div>
  <div class="row" id="row">
    <svg class="ico" id="lo" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7.5a3.2 3.2 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="slider" id="sl" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
      <div class="track" id="tr"><div class="fill" id="fill"></div></div>
      <div class="bub" id="bub">62</div>
    </div>
    <svg class="ico" id="hi" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 7.5h3l4-3.5v12l-4-3.5H2z" fill="currentColor"/><path d="M12 7.5a3.2 3.2 0 0 1 0 5M14.5 5a6.6 6.6 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>
  <div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
</div>
<script>
(function(){
  var sl=document.getElementById('sl'),tr=document.getElementById('tr'),fill=document.getElementById('fill'),bub=document.getElementById('bub'),
      row=document.getElementById('row'),val=document.getElementById('val'),lo=document.getElementById('lo'),hi=document.getElementById('hi');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var value=62,over=0,ov=0,dragging=false,auto=!reduce,M=26;
  // rubber band: px of overshoot → visible stretch with diminishing returns
  function band(px){var s=px<0?-1:1;return s*M*(1-Math.exp(-Math.abs(px)/(M*1.6)))}
  function render(){
    var W=sl.offsetWidth,st=band(over),a=Math.abs(st)/W;
    // stretch the track away from its anchored end and thin it slightly
    tr.style.transformOrigin=st<0?'100% 50%':'0 50%';
    tr.style.transform='scaleX('+(1+a).toFixed(4)+') scaleY('+(1-a*2.2).toFixed(4)+')';
    fill.style.transform='scaleX('+(value/100).toFixed(4)+')';
    var bx=value/100*W+(st>0?st:0)+(st<0?st*(1-value/100):0);
    bub.style.left=bx.toFixed(1)+'px';bub.textContent=Math.round(value);
    lo.style.transform=st<0?'translateX('+(st*.9).toFixed(1)+'px) scale('+(1+a*3)+')':'';
    hi.style.transform=st>0?'translateX('+(st*.9).toFixed(1)+'px) scale('+(1+a*3)+')':'';
    val.firstChild.nodeValue=Math.round(value);
    sl.setAttribute('aria-valuenow',Math.round(value));
  }
  function setRaw(v){ // v may exceed 0..100; excess becomes overshoot in px
    var W=sl.offsetWidth;
    if(v>100){over=(v-100)/100*W;v=100}else if(v<0){over=v/100*W;v=0}else over=0;
    value=v;
  }
  // spring the overshoot back to 0 after release
  var springing=false;
  function release(){springing=true;ov=0}
  var last=performance.now();
  function frame(now){
    var dt=Math.min(.032,(now-last)/1000);last=now;
    if(auto)demo(now);
    if(springing&&!dragging){
      ov+=(-420*over-22*ov)*dt;over+=ov*dt;
      if(Math.abs(over)<.05&&Math.abs(ov)<1){over=0;springing=false}
    }
    render();requestAnimationFrame(frame);
  }
  // ---- input
  var sx=0,sv=0;
  sl.addEventListener('pointerdown',function(e){
    stopAuto();dragging=true;springing=false;sl.setPointerCapture(e.pointerId);row.classList.add('active');
    var r=sl.getBoundingClientRect();
    // tap jumps to the spot, then drags relatively from there
    setRaw((e.clientX-r.left)/r.width*100);sx=e.clientX;sv=value;
  });
  sl.addEventListener('pointermove',function(e){
    if(!dragging)return;setRaw(sv+(e.clientX-sx)/sl.offsetWidth*100);
  });
  function up(){if(!dragging)return;dragging=false;row.classList.remove('active');release()}
  sl.addEventListener('pointerup',up);sl.addEventListener('pointercancel',up);
  sl.addEventListener('keydown',function(e){
    var d={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5,PageUp:10,PageDown:-10}[e.key];
    if(e.key==='Home')d=-100;if(e.key==='End')d=100;
    if(d===undefined)return;e.preventDefault();stopAuto();
    var t=value+d;
    if(t>100||t<0){over=(t>100?1:-1)*sl.offsetWidth*.08;release()} // bump against the end
    value=Math.max(0,Math.min(100,t));
  });
  // ---- demo: a scripted drag that overshoots both ends
  var K=[[0,62,0],[700,62,1],[1500,92,1],[2300,116,1],[2700,116,0],[3600,100,0],[4300,100,1],[5200,30,1],[6100,-14,1],[6500,-14,0],[7600,0,0],[8200,0,1],[9200,62,1],[9600,62,0],[10400,62,0]];
  var t0=performance.now(),wasActive=false;
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  function demo(now){
    var t=(now-t0)%10400,i=0;while(i<K.length-2&&K[i+1][0]<=t)i++;
    var a=K[i],b=K[i+1],p=(t-a[0])/(b[0]-a[0]),act=!!a[2];
    if(act){setRaw(a[1]+(b[1]-a[1])*ease(Math.min(1,p)))}
    if(act!==wasActive){row.classList.toggle('active',act);if(!act)release();wasActive=act}
  }
  function stopAuto(){if(auto){auto=false;row.classList.remove('active')}}
  setRaw(62);render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
