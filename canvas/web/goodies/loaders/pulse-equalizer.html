<!doctype html>
<!-- pi-canvas goodie: Pulse Equalizer. Original implementation. Inspired by Reacticx pulsing-dots / siri (MIT) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Equalizer</title>
<style>
  html,body{margin:0;height:100%}
  body{background:radial-gradient(70% 55% at 50% 38%,#151327 0%,#0a0a0b 70%);color:#f2f2f5;overflow:hidden;display:grid;place-items:center;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{display:flex;flex-direction:column;align-items:center;user-select:none}
  .stage{position:relative;width:min(40vmin,128px);aspect-ratio:1;display:grid;place-items:center}
  .ring{position:absolute;inset:14%;border-radius:50%;border:1.5px solid #a78bfa;opacity:0;pointer-events:none}
  .live .ring{animation:pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite}
  .ring:nth-child(2){animation-delay:.8s!important}.ring:nth-child(3){animation-delay:1.6s!important}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
  .orb{position:relative;width:72%;aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;outline:none;
    background:#140f2a;box-shadow:0 0 40px -4px #8b5cf6aa,0 0 0 1px #ffffff14 inset;transition:filter .5s,box-shadow .5s}
  .orb:focus-visible{box-shadow:0 0 0 2px #0a0a0b,0 0 0 4px #c4b5fd}
  .blobs{position:absolute;inset:-25%;filter:blur(10px);animation:spin 6s linear infinite}
  .blobs i{position:absolute;width:62%;height:62%;border-radius:50%;mix-blend-mode:screen;opacity:.95}
  .blobs i:nth-child(1){left:6%;top:10%;background:#22d3ee}
  .blobs i:nth-child(2){right:4%;top:18%;background:#a855f7}
  .blobs i:nth-child(3){left:22%;bottom:2%;background:#f472b6}
  .gloss{position:absolute;inset:0;border-radius:50%;background:radial-gradient(60% 45% at 35% 22%,#ffffffaa,transparent 70%),radial-gradient(80% 80% at 50% 120%,#00000088,transparent 60%)}
  .mic{position:absolute;inset:0;margin:auto;width:30%;height:30%;color:#fff;filter:drop-shadow(0 1px 3px #0009) drop-shadow(0 0 10px #3b0764aa)}
  .off .orb{filter:grayscale(.85) brightness(.55);box-shadow:0 0 0 1px #ffffff14 inset}
  .off .blobs{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(1turn)}}
  .eq{display:flex;align-items:center;gap:3px;height:44px;margin-top:14px}
  .eq i{width:4px;height:100%;border-radius:2px;transform:scaleY(.08);will-change:transform}
  .status{margin-top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a78bfa;display:flex;align-items:center;gap:7px}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .off .status{color:#5e5e69}
  .tr{margin-top:6px;font-size:14.5px;color:#e8e8ee;height:20px;letter-spacing:-.005em;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
  .tr span{opacity:0;transition:opacity .3s}.tr span.on{opacity:1}
  .tr .dim{color:#6f6f7a}
  @media (prefers-reduced-motion:reduce){.blobs,.live .ring{animation:none}}
</style></head>
<body>
<div class="wrap live" id="wrap">
  <div class="stage"><span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <div class="orb" id="orb" tabindex="0" role="button" aria-pressed="true" aria-label="Toggle microphone">
      <div class="blobs"><i></i><i></i><i></i></div><div class="gloss"></div>
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </div></div>
  <div class="eq" id="eq" aria-hidden="true"></div>
  <div class="status" id="status">Listening</div>
  <div class="tr" id="tr" aria-live="polite"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), orb = $('orb'), eq = $('eq'), status = $('status'), tr = $('tr');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NB = 23, bars = [];
  for (let i = 0; i < NB; i++) {
    const b = document.createElement('i'), u = i / (NB - 1);
    const c = u < .5 ? [34 + (168 - 34) * u * 2, 211 + (85 - 211) * u * 2, 238 + (247 - 238) * u * 2] : [168 + (244 - 168) * (u - .5) * 2, 85 + (114 - 85) * (u - .5) * 2, 247 + (182 - 247) * (u - .5) * 2];
    b.style.background = `linear-gradient(#fff6,rgb(${c.map(Math.round)}) 40%)`;
    eq.appendChild(b); bars.push({ el: b, v: .08, ph: Math.random() * 6.28 });
  }
  const scripts = [
    ['Remind', 'me', 'to', 'call', 'Ana', 'at', 'five'],
    ['What’s', 'on', 'my', 'calendar', 'tomorrow?'],
    ['Play', 'something', 'calm', 'for', 'focus']
  ];
  const replies = ['Reminder set for 5:00 PM', '3 events · first at 9:30', 'Playing “Deep Focus”'];
  let mode = 'listen', si = 0, wi = 0, wordT = 0, modeT = 0, amp = 0, target = 0, nextJ = 0, on = true, auto = true, near = 0, t = 0;
  let last = performance.now();
  const setWords = () => {
    tr.textContent = '';
    scripts[si].forEach((w, i) => { const s = document.createElement('span'); s.textContent = (i ? ' ' : '') + w; tr.appendChild(s); });
  };
  const setMode = m => {
    mode = m; modeT = 0;
    status.textContent = { listen: 'Listening', think: 'Thinking', reply: 'Done', off: 'Mic off' }[m];
    if (m === 'listen') { wi = 0; wordT = 0; setWords(); }
    if (m === 'reply' || m === 'off') { tr.innerHTML = ''; const s = document.createElement('span'); s.className = m === 'off' ? 'on dim' : 'on'; s.textContent = m === 'off' ? 'Tap the orb to speak' : replies[si]; tr.appendChild(s); }
  };
  setMode('listen');
  if (reduce) {
    [...tr.children].forEach(s => s.classList.add('on'));
    bars.forEach((b, i) => b.el.style.transform = `scaleY(${(.18 + .6 * Math.sin(i / (NB - 1) * Math.PI) ** 2).toFixed(3)})`);
    return;
  }
  const frame = now => {
    const dt = Math.min(50, now - last) / 1000; last = now; t += dt; modeT += dt;
    if (mode === 'listen') {
      wordT += dt;
      const words = tr.children;
      if (wi < words.length && wordT > 0.38) { words[wi++].classList.add('on'); wordT = 0; }
      if ((nextJ -= dt) <= 0) { nextJ = 0.07 + Math.random() * 0.08; target = wordT < 0.26 && wi <= words.length ? 0.45 + Math.random() * 0.55 : 0.08 + Math.random() * 0.1; }
      if (auto && wi >= words.length && wordT > 0.9) setMode('think');
      if (!auto && wi >= words.length) target = 0.05 + Math.random() * 0.06 + near * 0.5;
    } else if (mode === 'think') { target = 0.3; if (modeT > 1.3) setMode('reply'); }
    else if (mode === 'reply') { target = 0.06; if (modeT > 2) { si = (si + 1) % scripts.length; setMode('listen'); } }
    else target = 0;
    amp += (target - amp) * Math.min(1, dt * 14);
    bars.forEach((b, i) => {
      const u = i / (NB - 1), shape = 0.35 + 0.65 * Math.sin(u * Math.PI) ** 1.5;
      let h;
      if (mode === 'think') h = 0.12 + 0.5 * Math.max(0, Math.sin(t * 7 - u * 9)) ** 3;
      else if (mode === 'off') h = 0.08;
      else h = 0.08 + amp * shape * (0.75 + 0.5 * Math.sin(t * 13 + b.ph + u * 5));
      b.v += (h - b.v) * Math.min(1, dt * 18);
      b.el.style.transform = `scaleY(${Math.max(0.08, Math.min(1, b.v)).toFixed(3)})`;
    });
    const s = mode === 'off' ? 0.94 : 1 + amp * 0.1 + near * 0.06 + (mode === 'think' ? 0.03 * Math.sin(t * 6) : 0);
    orb.style.transform = `scale(${s.toFixed(3)})`;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const toggle = () => {
    auto = false; on = !on;
    wrap.classList.toggle('live', on); wrap.classList.toggle('off', !on);
    orb.setAttribute('aria-pressed', String(on));
    if (on) { si = (si + 1) % scripts.length; setMode('listen'); } else setMode('off');
  };
  orb.addEventListener('click', toggle);
  orb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  addEventListener('pointermove', e => {
    const r = orb.getBoundingClientRect(), d = Math.hypot(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
    near = Math.max(0, 1 - d / 160);
  });
  addEventListener('pointerleave', () => { near = 0; });
})();
</script>
</body></html>
