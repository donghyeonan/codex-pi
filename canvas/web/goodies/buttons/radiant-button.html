<!doctype html>
<!-- pi-canvas goodie: Radiant Button. Original implementation. Inspired by Reacticx radiant-button (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radiant Button</title>
<style>
  html,body{margin:0;height:100%}
  body{
    background:#0a0a0b;display:grid;place-items:center;overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:relative}
  .halo{position:absolute;inset:-70px -90px;pointer-events:none;filter:blur(22px);opacity:var(--o,.85);
    background:
      radial-gradient(150px 95px at var(--hx) var(--hy),rgba(255,122,89,.95),rgba(255,64,160,.75) 35%,rgba(124,92,255,.45) 62%,transparent 80%);
    transition:opacity .4s}
  .btn{
    --x:50%;--y:50%;
    position:relative;display:inline-flex;align-items:center;gap:10px;height:clamp(46px,27vh,54px);padding:0 26px;
    border:0;border-radius:16px;cursor:pointer;outline:none;color:#fff;
    font-family:inherit;font-weight:600;font-size:16px;line-height:1;letter-spacing:-.01em;
    background:
      radial-gradient(140px 90px at var(--x) var(--y),rgba(255,255,255,.11),transparent 70%),
      linear-gradient(180deg,#17161c,#0f0e13);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -18px rgba(0,0,0,.9);
    transition:transform .4s cubic-bezier(.25,1.5,.45,1);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97);transition-duration:.12s}
  .btn::before,.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  /* resting rim */
  .btn::before{background:linear-gradient(120deg,rgba(255,138,101,.35),rgba(255,79,163,.25),rgba(124,92,255,.35))}
  /* hot rim following the light */
  .btn::after{background:radial-gradient(90px 70px at var(--x) var(--y),#fff 0%,#ffb199 18%,#ff5fa2 40%,rgba(124,92,255,.6) 62%,transparent 80%)}
  .btn:focus-visible{box-shadow:0 0 0 4px rgba(255,95,162,.35)}
  .btn svg{width:18px;height:18px;flex:none}
  .lbl{background:linear-gradient(180deg,#fff,#d9d6e4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-family:inherit;font-weight:600;font-size:10.5px;line-height:1;letter-spacing:.06em;padding:5px 7px;border-radius:999px;color:#ffd1c2;
    background:linear-gradient(90deg,rgba(255,122,89,.18),rgba(255,64,160,.18));box-shadow:inset 0 0 0 1px rgba(255,140,120,.25)}
  .note{position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;font-size:12.5px;color:#7d7b88}
  .note b{color:#c5c2d0;font-weight:500}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="halo" id="halo"></div>
  <button class="btn" id="btn" type="button">
    <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb199"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs>
      <path d="M10.2 1.5 3.6 10.1h4.8l-.9 6.4 6.9-8.8H9.5l.7-6.2z" fill="url(#lg)"/>
    </svg>
    <span class="lbl">Upgrade to Pro</span>
    <span class="tag">−20%</span>
  </button>
  <div class="note"><b>$16</b>/month · billed yearly</div>
</div>
<script>
(function(){
  var btn=document.getElementById('btn'),halo=document.getElementById('halo');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var auto=true,tx=0,ty=0,x=0,y=0,inside=false,t0=performance.now();
  // halo box is offset from button by (44,34)
  var OX=90,OY=70;
  function apply(){
    btn.style.setProperty('--x',x.toFixed(1)+'px');btn.style.setProperty('--y',y.toFixed(1)+'px');
    halo.style.setProperty('--hx',(x+OX).toFixed(1)+'px');halo.style.setProperty('--hy',(y+OY).toFixed(1)+'px');
  }
  function orbit(now){
    var w=btn.offsetWidth,h=btn.offsetHeight,a=(now-t0)/1000*1.25-1.2;
    tx=w/2+Math.cos(a)*(w/2+6);ty=h/2+Math.sin(a)*(h/2+10);
  }
  function frame(now){
    if(auto)orbit(now);
    var k=auto?.18:.16;x+=(tx-x)*k;y+=(ty-y)*k;apply();
    requestAnimationFrame(frame);
  }
  orbit(t0+600);x=tx;y=ty;apply();
  if(!reduce)requestAnimationFrame(frame);
  addEventListener('pointermove',function(e){
    if(!e.movementX&&!e.movementY)return; // ignore synthetic hover events on load
    auto=false;var r=btn.getBoundingClientRect();
    tx=e.clientX-r.left;ty=e.clientY-r.top;
    var d=Math.hypot(Math.max(r.left-e.clientX,0,e.clientX-r.right),Math.max(r.top-e.clientY,0,e.clientY-r.bottom));
    halo.style.setProperty('--o',Math.max(.25,.95-d/160).toFixed(2));
    if(reduce){x=tx;y=ty;apply()}
  });
  document.documentElement.addEventListener('pointerleave',function(){halo.style.setProperty('--o','.55')});
  btn.addEventListener('click',function(){
    if(reduce)return;
    halo.animate([{opacity:1,transform:'scale(1)'},{opacity:1,transform:'scale(1.25)'},{opacity:.85,transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
})();
</script>
</body>
</html>
