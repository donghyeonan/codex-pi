<!doctype html>
<!-- pi-canvas goodie: Save Button. Original implementation. Inspired by Reacticx save-button (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save Button</title>
<style>
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(80% 70% at 50% 45%,#131316 0%,#0a0a0b 75%);
    display:grid;place-items:center;overflow:hidden;color:#ededf0;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .file{display:flex;align-items:center;gap:10px;font-size:13px}
  .file .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(180deg,#24242a,#18181c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .file .name{font-weight:600;letter-spacing:-.01em}
  .status{display:flex;align-items:center;gap:6px;color:#8d8c96;font-size:12px;margin-top:3px;height:14px;overflow:hidden}
  .status i{width:6px;height:6px;border-radius:50%;background:#f5a524;box-shadow:0 0 8px rgba(245,165,36,.7);transition:background .3s,box-shadow .3s}
  .status span{display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
  [data-s="loading"] .status i{background:#60a5fa;box-shadow:0 0 8px rgba(96,165,250,.7)}
  [data-s="done"] .status i{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.7)}
  .btn{
    position:relative;height:48px;width:var(--w,160px);border:0;border-radius:999px;cursor:pointer;outline:none;padding:0;
    background:#f5f5f4;color:#0c0c0e;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px rgba(255,255,255,.25);
    transition:width .55s cubic-bezier(.65,0,.25,1.15),background-color .4s,box-shadow .4s,transform .3s cubic-bezier(.3,1.6,.5,1);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.25)}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
    opacity:0;transform:translateY(8px) scale(.9);transition:opacity .3s,transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
  [data-s="idle"] .l-idle,[data-s="loading"] .l-load,[data-s="done"] .l-done{opacity:1;transform:none;transition-delay:.12s}
  [data-s="loading"] .btn{background:#1f1f24;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  [data-s="done"] .btn{background:#22c55e;color:#03140a;box-shadow:0 10px 34px -10px rgba(34,197,94,.7),inset 0 1px 0 rgba(255,255,255,.35)}
  .spin{width:22px;height:22px;animation:rot .8s linear infinite}
  .spin circle{fill:none;stroke-width:2.5;stroke-linecap:round}
  @keyframes rot{to{transform:rotate(360deg)}}
  .chk path{stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .45s cubic-bezier(.65,0,.35,1) .3s}
  [data-s="done"] .chk path{stroke-dashoffset:0}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 0 rgba(34,197,94,.55);opacity:0}
  [data-s="done"] .btn::after{animation:ping .9s cubic-bezier(.2,.8,.2,1) .25s}
  @keyframes ping{0%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{opacity:0;box-shadow:0 0 0 18px rgba(34,197,94,0)}}
  .kbd{font:500 11px/1 ui-monospace,"SF Mono",Menlo,monospace;color:#6e6d78;letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){.btn,.layer,.status span,.chk path{transition:none}.spin{animation-duration:2s}}
</style>
</head>
<body>
<div class="wrap" id="root" data-s="idle">
  <div class="file">
    <div class="ic"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 1.5h5l3 3v8H3z" stroke="#a1a1aa" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1.5v3h3" stroke="#a1a1aa" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
    <div>
      <div class="name">Q4 Roadmap</div>
      <div class="status"><i></i><span id="st">Unsaved changes</span></div>
    </div>
  </div>
  <button class="btn" id="btn" type="button" aria-live="polite">
    <span class="layer l-idle" id="idle">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2.5h8l2.5 2.5v8.5h-11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 2.5v3h4.5v-3M5 13.5V9.5h6v4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Save changes
    </span>
    <span class="layer l-load" aria-hidden="true">
      <svg class="spin" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.5" stroke="rgba(255,255,255,.14)"/><circle cx="11" cy="11" r="8.5" stroke="#fff" stroke-dasharray="16 60"/></svg>
    </span>
    <span class="layer l-done" id="done">
      <svg class="chk" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 9.5l3.3 3.2L14 5.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Saved
    </span>
  </button>
  <div class="kbd">⌘ S to save</div>
</div>
<script>
(function(){
  var root=document.getElementById('root'),btn=document.getElementById('btn'),st=document.getElementById('st');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W={},timers=[],busy=false,auto=!reduce;
  var copy={idle:'Unsaved changes',loading:'Saving…',done:'All changes saved'};
  function measure(){
    // natural content widths + horizontal padding; loading is a perfect circle
    W.idle=Math.ceil(document.getElementById('idle').scrollWidth)+52;
    W.done=Math.ceil(document.getElementById('done').scrollWidth)+48;
    W.loading=48;
    btn.style.setProperty('--w',W[root.dataset.s]+'px');
  }
  // layers are absolutely positioned, so let them size to content for measuring
  ['idle','done'].forEach(function(id){var el=document.getElementById(id);el.style.position='static';el.style.width='max-content'});
  measure();
  ['idle','done'].forEach(function(id){var el=document.getElementById(id);el.style.position='';el.style.width=''});
  function set(s){
    root.dataset.s=s;btn.style.setProperty('--w',W[s]+'px');
    if(reduce){st.textContent=copy[s];return}
    st.animate([{transform:'none',opacity:1},{transform:'translateY(-10px)',opacity:0}],{duration:160,easing:'ease-in'}).onfinish=function(){
      st.textContent=copy[s];
      st.animate([{transform:'translateY(10px)',opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
    };
  }
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function run(){
    if(busy)return;busy=true;set('loading');
    later(function(){set('done')},1500);
    later(function(){set('idle');busy=false;if(auto)later(run,1700)},3500);
  }
  function stopAuto(){if(!auto)return;auto=false;timers.forEach(clearTimeout);timers=[];busy=false}
  btn.addEventListener('click',function(){
    if(auto){stopAuto();if(root.dataset.s!=='idle')set('idle')}
    if(root.dataset.s==='idle')run();
  });
  addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();stopAuto();btn.focus();run()}});
  if(auto)later(run,900);
})();
</script>
</body>
</html>
