<!doctype html>
<!-- pi-canvas goodie: Nebula Orb. Original implementation. Inspired by Reacticx nebula-orb (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula Orb</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
  body { position: relative; font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif; cursor: crosshair; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cap {
    position: absolute; left: 50%; bottom: clamp(10px, 6%, 26px); transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px;
    font: 500 12px/1 ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif;
    letter-spacing: .02em; color: rgba(236, 230, 255, .78);
    background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); user-select: none; pointer-events: none;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #b48cff; box-shadow: 0 0 10px #b48cff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated nebula orb" role="img"></canvas>
<div class="cap"><span class="dot"></span><span id="lbl">Listening…</span></div>
<script>
(() => {
  const cv = document.getElementById('c');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  // pointer (normalised -1..1), smoothed; "energy" spikes on click
  const m = { x: -.35, y: .45, tx: -.35, ty: .45 };
  let user = false, energy = 0, t0 = performance.now(), tOff = 0;

  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FS = `precision highp float;
uniform vec2 R;uniform float T;uniform vec2 M;uniform float E;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
 for(int i=0;i<5;i++){v+=a*n(p);p=r*p*2.03+3.1;a*=.5;}return v;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y)-vec2(0.,.035);
 float rad=.33+.008*sin(T*1.3)+.02*E;
 vec2 p=(uv-M*.025)/rad; float r=length(p);
 float vig=1.-.7*length(uv);
 vec3 col=vec3(.018,.012,.04)*vig+vec3(.05,.02,.09)*exp(-length(uv)*2.5);
 vec2 sc=floor(gl_FragCoord.xy/2.5); float s=h(sc);
 col+=step(.9965,s)*vec3(.7,.75,1.)*(.35+.35*sin(T*1.7+s*90.))*smoothstep(1.2,1.6,r);
 float a=atan(p.y,p.x);
 float wob=n(vec2(cos(a),sin(a))*2.2+T*.35);
 float g=exp(-max(r-1.,0.)*(3.6-E))*smoothstep(.96,1.03,r);
 col+=g*mix(vec3(.38,.22,1.),vec3(1.,.35,.75),wob)*(.42+.3*wob+.4*E);
 if(r<1.){
  float z=sqrt(1.-r*r); vec3 nr=vec3(p,z);
  float t=T*.11*(1.+E*2.);
  vec2 sp=vec2(atan(nr.x,nr.z)*1.25+T*.06,asin(nr.y)*1.3);
  vec2 q=vec2(fbm(sp+vec2(0.,t)),fbm(sp+vec2(5.2,1.3)-t));
  vec2 w=vec2(fbm(sp+2.8*q+vec2(1.7,9.2)+t*1.3),fbm(sp+2.8*q+vec2(8.3,2.8)-t));
  float f=smoothstep(.15,.85,fbm(sp+3.2*w));
  vec3 c=mix(vec3(.03,.01,.14),vec3(.45,.12,.9),clamp(f*f*1.8,0.,1.));
  c=mix(c,vec3(1.,.3,.62),smoothstep(.62,.95,length(q))*.9);
  c=mix(c,vec3(.25,.85,1.),smoothstep(.5,.8,w.y)*.85);
  vec3 L=normalize(vec3(M*.9,.85));
  float dif=.3+.7*max(dot(nr,L),0.);
  float sp2=pow(max(dot(reflect(-L,nr),vec3(0,0,1)),0.),28.);
  float fr=pow(1.-z,2.2);
  c=c*dif*(.55+1.35*f)+sp2*.45*vec3(1.,.92,1.)+fr*vec3(.5,.42,1.)*(1.1+E);
  c+=vec3(.9,.7,1.)*pow(f,5.)*.9*(.6+E);
  col=mix(col,c,smoothstep(1.,.988,r));
 }
 col=1.-exp(-col*1.35);
 gl_FragColor=vec4(pow(col,vec3(.92)),1.);
}`;

  let gl = null, U = {}, ctx = null;
  try { gl = cv.getContext('webgl', { antialias: false, alpha: false }); } catch (e) { gl = null; }
  if (gl) {
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) gl = null;
    else {
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      ['R', 'T', 'M', 'E'].forEach(k => U[k] = gl.getUniformLocation(pr, k));
    }
  }
  if (!gl) ctx = cv.getContext('2d');

  function size() {
    W = Math.max(1, Math.round(cv.clientWidth * DPR));
    H = Math.max(1, Math.round(cv.clientHeight * DPR));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    if (gl) gl.viewport(0, 0, W, H);
  }

  // Canvas2D fallback: layered rotating radial gradients
  function draw2d(t) {
    const r = Math.min(W, H) * .33, cx = W / 2, cy = H / 2;
    ctx.fillStyle = '#07060b'; ctx.fillRect(0, 0, W, H);
    let g = ctx.createRadialGradient(cx, cy, r * .9, cx, cy, r * 2);
    g.addColorStop(0, 'rgba(120,80,255,.45)'); g.addColorStop(1, 'rgba(120,80,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
    ctx.fillStyle = '#1a0a3a'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    [['255,90,190', 0], ['90,200,255', 2.1], ['150,80,255', 4.2]].forEach(([c, o]) => {
      const x = cx + Math.cos(t * .4 + o) * r * .45, y = cy + Math.sin(t * .5 + o) * r * .45;
      const gg = ctx.createRadialGradient(x, y, 0, x, y, r * .9);
      gg.addColorStop(0, `rgba(${c},.75)`); gg.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
    });
    ctx.restore();
  }

  function frame(now) {
    const t = (now - t0) / 1000 + tOff;
    if (!user) { m.tx = Math.cos(t * .35) * .6; m.ty = .35 + Math.sin(t * .5) * .35; }
    m.x += (m.tx - m.x) * .06; m.y += (m.ty - m.y) * .06;
    energy *= .955;
    size();
    if (gl) {
      gl.uniform2f(U.R, W, H); gl.uniform1f(U.T, t + 12);
      gl.uniform2f(U.M, m.x, m.y); gl.uniform1f(U.E, energy);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else draw2d(t);
    if (!reduce) requestAnimationFrame(frame);
  }

  const lbl = document.getElementById('lbl');
  const steer = (x, y) => {
    user = true;
    const r = document.body.getBoundingClientRect(), s = Math.min(r.width, r.height) / 2;
    m.tx = Math.max(-1.4, Math.min(1.4, (x - r.width / 2) / s));
    m.ty = Math.max(-1.4, Math.min(1.4, -(y - r.height / 2) / s));
    if (reduce) { m.x = m.tx; m.y = m.ty; frame(performance.now()); }
  };
  const burst = () => { energy = 1; lbl.textContent = 'Thinking…'; clearTimeout(burst.t); burst.t = setTimeout(() => lbl.textContent = 'Listening…', 1600); if (reduce) frame(performance.now()); };
  addEventListener('pointermove', e => { if (user || e.movementX || e.movementY) steer(e.clientX, e.clientY); });
  addEventListener('pointerdown', e => { steer(e.clientX, e.clientY); burst(); });
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); user = true; burst(); } });
  addEventListener('resize', () => reduce && frame(performance.now()));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
