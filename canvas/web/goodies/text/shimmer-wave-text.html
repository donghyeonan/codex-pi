<!doctype html>
<!-- pi-canvas goodie: Shimmer Wave Text. Original implementation. Inspired by Reacticx shimmer-wave-text (MIT) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shimmer Wave Text</title>
<style>
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#17171c 0%,#0a0a0b 60%);color:#fff;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{text-align:center;padding:0 6%;user-select:none;cursor:default}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#8b8b96;margin-bottom:14px}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 10px #7dd3fc}
  h1{margin:0;font-size:clamp(20px,6vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.08;white-space:nowrap}
  h1 span{display:inline-block;color:#4a4a55;will-change:transform,color}
  h1 .sp{width:.26em}
  p{margin:14px 0 0;font-size:clamp(12px,2.6vw,14px);color:#6b6b76;letter-spacing:-.005em}
  kbd{font:11px ui-monospace,"SF Mono",Menlo,monospace;color:#9a9aa6;border:1px solid #2a2a31;border-radius:5px;padding:1px 5px;background:#141418}
</style></head>
<body>
<div class="wrap" id="wrap">
  <div class="eyebrow"><i></i>Now in public beta</div>
  <h1 id="h" aria-label="Design at the speed of thought">Design at the speed of thought</h1>
  <p>Hover to steer the light &nbsp;<kbd>←</kbd> <kbd>→</kbd></p>
</div>
<script>
(() => {
  const h = document.getElementById('h');
  const text = h.textContent; h.textContent = '';
  const letters = [];
  for (const ch of text) {
    const s = document.createElement('span');
    s.setAttribute('aria-hidden', 'true');
    if (ch === ' ') s.className = 'sp'; else s.textContent = ch;
    h.appendChild(s); if (ch !== ' ') letters.push(s);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let centers = [], width = 1, left = 0;
  const measure = () => {
    const r = h.getBoundingClientRect(); left = r.left; width = r.width || 1;
    centers = letters.map(s => { const b = s.getBoundingClientRect(); return (b.left + b.width / 2 - left) / width; });
  };
  measure(); addEventListener('resize', measure);

  const base = [74, 74, 85], peak = [255, 255, 255], tint = [125, 211, 252];
  const paint = (pos, amt = 1) => {
    for (let i = 0; i < letters.length; i++) {
      const d = (centers[i] - pos) / 0.085;
      const k = Math.exp(-d * d) * amt;               // main crest
      const t = Math.exp(-((d + 1.6) ** 2) * 0.5) * amt * 0.5; // cool tail
      const c = base.map((b, j) => Math.round(b + (peak[j] - b) * k + (tint[j] - b) * t * (1 - k)));
      const s = letters[i].style;
      s.color = `rgb(${c})`;
      s.transform = `translateY(${(-7 * k).toFixed(2)}px) scale(${(1 + 0.04 * k).toFixed(3)})`;
      s.textShadow = k > 0.05 ? `0 0 ${18 * k}px rgba(186,230,253,${0.55 * k})` : 'none';
    }
  };

  if (reduce) { letters.forEach(s => s.style.color = '#ececf1'); return; }

  let auto = true, pos = -0.2, target = 0, last = performance.now(), amp = 1;
  const stopAuto = () => { auto = false; };
  addEventListener('pointermove', e => { if (!e.movementX && !e.movementY) return; stopAuto(); target = (e.clientX - left) / width; amp = 1; });
  addEventListener('pointerleave', () => { amp = 0; });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      stopAuto(); amp = 1; target = Math.max(-0.1, Math.min(1.1, target + (e.key === 'ArrowRight' ? 0.08 : -0.08)));
    }
  });
  let shown = 0;
  const loop = now => {
    const dt = Math.min(50, now - last); last = now;
    if (auto) {
      pos += dt / 2200 * 1.5;               // sweep across in ~2.2s
      if (pos > 1.3) pos = -0.3;
      shown = 1;
    } else {
      pos += (target - pos) * Math.min(1, dt / 90);
      shown += (amp - shown) * Math.min(1, dt / 160);
    }
    paint(pos, shown);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body></html>
