<!doctype html>
<!-- pi-canvas goodie: Rolling Counter. Original implementation. Inspired by Reacticx rolling-counter / number-flow (MIT) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolling Counter</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#0a0a0b;color:#f5f5f7;overflow:hidden;display:grid;place-items:center;
    font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:min(500px,calc(100vw - 32px));box-sizing:border-box;padding:20px 22px 18px;border-radius:18px;
    background:linear-gradient(180deg,#141417,#0f0f12);border:1px solid #232329;box-shadow:0 1px 0 #ffffff0a inset,0 24px 60px -24px #000}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8e8e99}
  .top b{font-weight:500;color:#c9c9d1}
  .seg{display:flex;gap:2px;background:#1b1b20;border:1px solid #26262c;border-radius:9px;padding:2px}
  .seg button{all:unset;cursor:pointer;font-size:12px;padding:4px 9px;border-radius:7px;color:#8e8e99;transition:background .2s,color .2s}
  .seg button.on{background:#2a2a31;color:#fff}
  .seg button:focus-visible{outline:2px solid #6ee7b7}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:12px}
  .num{display:flex;font-size:clamp(36px,11vw,58px);font-weight:650;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;height:1.12em;overflow:hidden;
    -webkit-mask:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
  .col{position:relative;width:.62em;height:1.12em;overflow:hidden;transition:width .5s cubic-bezier(.16,1,.3,1)}
  .col.sym{width:.3em}.col.cur{width:.6em;color:#8e8e99}
  .strip{position:absolute;left:0;right:0;top:0;transition:transform 1.1s cubic-bezier(.2,1.25,.32,1)}
  .strip div{height:1.12em;display:flex;align-items:center;justify-content:center}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 8px;border-radius:999px;
    color:#6ee7b7;background:#10b9811a;border:1px solid #10b98133;transition:color .3s,background .3s,border-color .3s;white-space:nowrap}
  .delta.neg{color:#fda4af;background:#f43f5e1a;border-color:#f43f5e33}
  .delta svg{transition:transform .4s}.delta.neg svg{transform:rotate(180deg)}
  .bars{display:flex;align-items:flex-end;gap:4px;height:44px;flex:1;max-width:170px}
  .bars i{flex:1;border-radius:3px;background:#2a2a31;transition:height .9s cubic-bezier(.16,1,.3,1),background .4s}
  .bars i:last-child{background:linear-gradient(#6ee7b7,#10b981)}
  .foot{margin-top:12px;font-size:12px;color:#5f5f6a;display:flex;justify-content:space-between}
  @media (max-width:420px){.bars,.foot span:last-child{display:none}.top>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}}
  @media (max-height:200px){.foot{display:none}.card{padding:14px 16px}}
  @media (prefers-reduced-motion:reduce){.strip,.col,.bars i{transition:none}}
</style></head>
<body>
<div class="card">
  <div class="top"><span><b>Net revenue</b> · This month</span>
    <div class="seg" id="seg"><button data-r="0" class="on">MRR</button><button data-r="1">ARR</button><button data-r="2">Today</button></div></div>
  <div class="row">
    <div>
      <div class="num" id="num" aria-live="polite"></div>
      <div style="margin-top:10px"><span class="delta" id="delta"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 1l4 5H6v3H4V6H1z" fill="currentColor"/></svg><span id="dv">+11.4%</span></span>
        <span style="font-size:12px;color:#6b6b76;margin-left:6px">vs last period</span></div>
    </div>
    <div class="bars" id="bars"></div>
  </div>
  <div class="foot"><span id="upd">Updated just now</span><span>Click the number to refresh</span></div>
</div>
<script>
(() => {
  const num = document.getElementById('num'), bars = document.getElementById('bars');
  const delta = document.getElementById('delta'), dv = document.getElementById('dv'), upd = document.getElementById('upd');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let i = 0; i < 12; i++) bars.appendChild(document.createElement('i'));
  let cols = [];
  const fmt = v => '$' + Math.round(v).toLocaleString('en-US');

  const makeCol = ch => {
    const c = document.createElement('div'); c.className = 'col';
    const s = document.createElement('div'); s.className = 'strip';
    if (/\d/.test(ch)) { for (let d = 0; d < 10; d++) { const e = document.createElement('div'); e.textContent = d; s.appendChild(e); } }
    else { c.classList.add(ch === '$' ? 'cur' : 'sym'); const e = document.createElement('div'); e.textContent = ch; s.appendChild(e); }
    c.appendChild(s); c.dataset.ch = /\d/.test(ch) ? 'd' : ch; return c;
  };
  const set = v => {
    const str = fmt(v);
    num.setAttribute('aria-label', str);
    // align from the right so units/tens keep their columns
    const want = [...str];
    while (cols.length > want.length) { const c = cols.shift(); c.style.width = '0'; setTimeout(() => c.remove(), 500); }
    while (cols.length < want.length) {
      const ch = want[want.length - cols.length - 1];
      const c = makeCol(/\d/.test(ch) ? '0' : ch); const ref = cols[0] || null;
      num.insertBefore(c, ref && ref.parentNode ? ref : null); cols.unshift(c);
      if (/\d/.test(ch)) { c.style.width = '0'; c.getBoundingClientRect(); c.style.width = ''; }
    }
    want.forEach((ch, i) => {
      let c = cols[i];
      const isD = /\d/.test(ch);
      if ((c.dataset.ch === 'd') !== isD || (!isD && c.dataset.ch !== ch)) {
        const n = makeCol(ch); num.replaceChild(n, c); cols[i] = c = n; n.getBoundingClientRect();
      }
      if (isD) {
        const s = c.firstChild;
        s.style.transitionDelay = ((want.length - i) * 55) + 'ms';
        s.style.transform = `translateY(${-ch * 1.12}em)`;
      }
    });
  };
  const sets = [
    [12480, 13905, 15230, 14612, 16890],
    [149760, 166860, 182760, 175344],
    [412, 486, 531, 469, 602]
  ];
  let range = 0, step = 0, timer, auto = true, prev = sets[0][0];
  const render = v => {
    const pct = ((v - prev) / prev) * 100; prev = v;
    set(v);
    dv.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    delta.classList.toggle('neg', pct < 0);
    const hs = [...bars.children];
    hs.forEach((b, i) => { const h = 22 + 55 * Math.abs(Math.sin(v / 997 + i * 0.9)) + i * 2; b.style.height = Math.min(100, i === 11 ? 100 : h) + '%'; });
    upd.textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };
  set(sets[0][0]); render(sets[0][1]); step = 1;
  const next = () => { const s = sets[range]; step = (step + 1) % s.length; render(s[step]); };
  const loop = () => { timer = setTimeout(() => { if (auto) { next(); loop(); } }, 2600); };
  if (!reduce) loop();
  const stop = () => { auto = false; clearTimeout(timer); };
  num.style.cursor = 'pointer';
  num.addEventListener('click', () => { stop(); next(); });
  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; stop();
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    range = +b.dataset.r; step = 0; prev = sets[range][0]; render(sets[range][1]); step = 1;
  });
  addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { stop(); next(); } });
})();
</script>
</body></html>
