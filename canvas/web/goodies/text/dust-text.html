<!doctype html>
<!-- pi-canvas goodie: Dust Text. Original implementation. Inspired by Reacticx dust-text / letter-swarm (MIT) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dust Text</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0b;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;filter:drop-shadow(0 0 6px rgba(244,114,182,.35));touch-action:none}
  .hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:12px ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    color:#55555f;letter-spacing:.02em;pointer-events:none}
</style></head>
<body>
<canvas id="c" aria-label="Particle text"></canvas>
<div class="hint">Move to scatter · click for the next word</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const words = ['canvas', 'imagine', 'create'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '800 {s}px ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif';
  let W, H, dpr, P = [], wi = 0, mouse = null, auto = true, phase = 'hold', phaseT = 0;
  const N = 3200;

  const sample = word => {
    const o = document.createElement('canvas'); o.width = W; o.height = H;
    const g = o.getContext('2d');
    let s = Math.min(H * 0.5, W * 0.84 / (word.length * 0.62));
    g.font = FONT.replace('{s}', s);
    const m = g.measureText(word).width; if (m > W * 0.8) { s *= W * 0.8 / m; g.font = FONT.replace('{s}', s); }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.fillText(word, W / 2, H * 0.46);
    const d = g.getImageData(0, 0, W, H).data, pts = [];
    const step = Math.max(2, Math.round(2.6 * dpr));
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (d[(y * W + x) * 4 + 3] > 140) pts.push([x + (Math.random() - .5) * step * 1.1, y + (Math.random() - .5) * step * 1.1]);
    for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    return pts;
  };
  const hue = x => { // amber → rose → violet across the word
    const t = Math.max(0, Math.min(1, (x / W - 0.12) / 0.76));
    const a = [253, 224, 171], b = [251, 113, 133], c = [167, 139, 250];
    const [p, q, u] = t < .5 ? [a, b, t * 2] : [b, c, t * 2 - 1];
    return p.map((v, i) => Math.round(v + (q[i] - v) * u));
  };
  const assign = word => {
    const pts = sample(word);
    P.forEach((p, i) => {
      if (i < pts.length) { p.tx = pts[i][0]; p.ty = pts[i][1]; p.free = false; p.c = hue(p.tx); }
      else { p.free = true; p.tx = Math.random() * W; p.ty = Math.random() * H; p.c = [120, 120, 140]; }
    });
  };
  const resize = () => {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.width = Math.max(1, innerWidth * dpr | 0); H = cv.height = Math.max(1, innerHeight * dpr | 0);
    if (!P.length) for (let i = 0; i < N; i++) P.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, s: 0.5 + Math.random() ** 2 * 1.4, a: 0.55 + Math.random() * 0.45, ph: Math.random() * 6.28 });
    assign(words[wi]);
    if (reduce) P.forEach(p => { p.x = p.tx; p.y = p.ty; });
  };
  resize(); addEventListener('resize', resize);

  const pt = e => ({ x: e.clientX * dpr, y: e.clientY * dpr });
  cv.addEventListener('pointermove', e => { if (!e.movementX && !e.movementY) return; auto = false; mouse = pt(e); });
  cv.addEventListener('pointerleave', () => { mouse = null; });
  cv.addEventListener('pointerdown', e => {
    auto = false; mouse = pt(e);
    P.forEach(p => { const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy) + 1, f = 14 * dpr * Math.exp(-d / (90 * dpr)); p.vx += dx / d * f; p.vy += dy / d * f; });
    wi = (wi + 1) % words.length; assign(words[wi]);
  });

  let last = performance.now(), t = 0;
  const frame = now => {
    const dt = Math.min(40, now - last) / 16.67; last = now; t += dt;
    if (auto) {
      phaseT += dt * 16.67;
      if (phase === 'hold' && phaseT > 2800) { phase = 'blow'; phaseT = 0; }
      else if (phase === 'blow' && phaseT > 700) { phase = 'hold'; phaseT = 0; wi = (wi + 1) % words.length; assign(words[wi]); }
    }
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const R = 70 * dpr;
    for (const p of P) {
      if (phase === 'blow' && auto) {          // a gust carries the dust to the right and up
        p.vx += (0.5 + Math.sin(p.y * 0.02 + t * 0.05) * 0.4) * dpr * p.s;
        p.vy += (Math.cos(p.x * 0.015 + t * 0.07) * 0.35 - 0.12) * dpr;
      } else {
        const k = p.free ? 0.004 : 0.055, wob = p.free ? 0 : 0.9 * dpr;
        p.vx += (p.tx + Math.sin(t * 0.03 + p.ph) * wob - p.x) * k; p.vy += (p.ty + Math.cos(t * 0.025 + p.ph * 1.3) * wob - p.y) * k;
        if (p.free) { p.vx += Math.sin(t * 0.02 + p.ph) * 0.03 * dpr; p.vy += Math.cos(t * 0.017 + p.ph) * 0.03 * dpr; }
      }
      if (mouse) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < R * R) { const d = Math.sqrt(d2) + 0.01, f = (1 - d / R) * 3.2 * dpr; p.vx += dx / d * f + dy / d * f * 0.4; p.vy += dy / d * f - dx / d * f * 0.4; }
      }
      p.vx *= 0.84; p.vy *= 0.84;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x > W + 20) p.x -= W + 40;
      const sp = Math.min(1, Math.hypot(p.vx, p.vy) / (6 * dpr));
      const tw = 0.75 + 0.25 * Math.sin(t * 0.08 + p.ph);
      const c = p.free ? p.c : p.c.map(v => Math.min(255, v + sp * 60));
      ctx.fillStyle = `rgba(${c},${(p.free ? 0.22 : Math.min(1, p.a * tw * 1.25))})`;
      const s = p.s * dpr * (p.free ? 0.8 : 1.35 + sp * 0.6);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    if (!reduce) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body></html>
