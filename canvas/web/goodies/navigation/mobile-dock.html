<!doctype html>
<!-- pi-canvas goodie: Magnifying Dock. Original implementation. Inspired by Reacticx mobile-dock (MIT) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnifying Dock</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: #0a0a0b;
    background-image: radial-gradient(50% 70% at 25% 30%, rgba(122, 92, 255, .35), transparent 70%), radial-gradient(50% 70% at 80% 20%, rgba(255, 110, 150, .25), transparent 70%),
      radial-gradient(60% 60% at 60% 90%, rgba(40, 200, 190, .18), transparent 70%);
    font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .dock {
    position: relative; margin-bottom: clamp(12px, 8vh, 28px); display: flex; align-items: flex-end; gap: var(--gap); padding: var(--pad);
    height: var(--base); border-radius: calc(var(--base) * .42); --base: 44px; --gap: 6px; --pad: 7px;
    background: rgba(40, 40, 52, .38); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.22), 0 20px 40px -10px rgba(0,0,0,.6);
  }
  .item { position: relative; width: var(--base); height: var(--base); flex: none; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; outline: none; }
  .icon {
    width: 100%; height: 100%; border-radius: 23%; position: relative; overflow: hidden; display: grid; place-items: center;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.35);
  }
  .icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.22), transparent 50%); }
  .icon svg { width: 62%; height: 62%; position: relative; z-index: 1; }
  .item:focus-visible .icon { box-shadow: 0 0 0 2px #fff, 0 4px 10px rgba(0,0,0,.35); }
  .run { position: absolute; bottom: calc(var(--pad) * -1 + 1px); width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.75); opacity: 0; transition: opacity .3s; }
  .item.running .run { opacity: 1; }
  .item.bounce .icon { animation: bounce 1.1s cubic-bezier(.3, 0, .4, 1); }
  @keyframes bounce { 0%, 100% { transform: none; } 22% { transform: translateY(-46%); } 44% { transform: none; } 62% { transform: translateY(-22%); } 80% { transform: none; } }
  .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: rgba(255,255,255,.18); flex: none; }
  .tip {
    position: absolute; left: 0; top: 0; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #f2f2f5; white-space: nowrap;
    background: rgba(30, 30, 36, .85); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 16px rgba(0,0,0,.4);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .tip.show { opacity: 1; }
  .tip::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: inherit; border-radius: 0 0 2px 0; }
  @media (prefers-reduced-motion: reduce) { .item.bounce .icon { animation: none; } }
</style>
</head>
<body>
  <nav class="dock" id="dock" aria-label="Dock"></nav>
  <div class="tip" id="tip"></div>
<script>
(() => {
  const S = 'fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const apps = [
    ['Files', 'linear-gradient(#5fc8ff,#1e7bff)', `<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#fff" opacity=".95"/><path d="M3 10h18" stroke="#1e7bff" stroke-width="1.5"/>`],
    ['Messages', 'linear-gradient(#6cf08a,#18b84a)', `<path d="M12 4c5 0 9 3.2 9 7.3s-4 7.2-9 7.2c-1 0-2-.1-3-.4L4.5 20l1.3-3.6C4 15 3 13.3 3 11.3 3 7.2 7 4 12 4z" fill="#fff"/>`],
    ['Mail', 'linear-gradient(#64b6ff,#1d6dff)', `<rect x="3" y="6" width="18" height="13" rx="2" fill="#fff"/><path d="M3.5 7l8.5 6.5L20.5 7" stroke="#1d6dff" stroke-width="1.6" fill="none"/>`],
    ['Music', 'linear-gradient(#ff6b8b,#f52f57)', `<path d="M9 17.5V6l10-2v11.5" ${S}/><circle cx="7" cy="17.5" r="2.4" fill="#fff"/><circle cx="17" cy="15.5" r="2.4" fill="#fff"/>`],
    ['Photos', '#fff', [0, 45, 90, 135, 180, 225, 270, 315].map((a, i) => `<ellipse cx="12" cy="6.6" rx="3" ry="5.2" fill="${['#ffb000','#ff6d00','#ff2d55','#bf5af2','#5e5ce6','#0a84ff','#30d158','#ffd60a'][i]}" opacity=".85" transform="rotate(${a} 12 12)"/>`).join('')],
    ['Calendar', '#fff', `<text x="12" y="8" font-size="5.5" font-weight="700" text-anchor="middle" fill="#ff3b30" font-family="ui-sans-serif,sans-serif">THU</text><text x="12" y="20" font-size="12" font-weight="300" text-anchor="middle" fill="#111" font-family="ui-sans-serif,sans-serif">5</text>`],
    ['Notes', 'linear-gradient(#fff 0 26%,#fffbe6 26%)', `<path d="M5 3.5h14" stroke="#ffcc00" stroke-width="3"/><path d="M6 11h12M6 15h12M6 19h8" stroke="#c9c2a0" stroke-width="1.2"/>`],
    ['Maps', 'linear-gradient(135deg,#a5e88a,#62c46a 60%,#f2e7c9 60%)', `<path d="M2 18L22 6" stroke="#fff" stroke-width="3"/><path d="M8 2v20" stroke="#ffcf3f" stroke-width="2.4"/><circle cx="15" cy="9" r="3.4" fill="#ff3b30" stroke="#fff" stroke-width="1.4"/>`],
    ['Settings', 'linear-gradient(#a6a6ae,#5d5d66)', `<circle cx="12" cy="12" r="6.5" fill="none" stroke="#2b2b30" stroke-width="3" stroke-dasharray="2.2 1.9"/><circle cx="12" cy="12" r="5" fill="#d7d7dc"/><circle cx="12" cy="12" r="2" fill="#5d5d66"/>`],
    null,
    ['Trash', 'rgba(255,255,255,.08)', `<path d="M6 7h12l-1 13H7z" fill="rgba(255,255,255,.28)" stroke="#e8e8ee" stroke-width="1.2"/><path d="M5 7h14M10 4h4M9 10v7M12 10v7M15 10v7" stroke="#e8e8ee" stroke-width="1.2" stroke-linecap="round"/>`],
  ];
  const dock = document.getElementById('dock'), tip = document.getElementById('tip');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = [];
  apps.forEach((a, i) => {
    if (!a) { const s = document.createElement('div'); s.className = 'sep'; dock.appendChild(s); return; }
    const el = document.createElement('div');
    el.className = 'item' + ([1, 3].includes(i) ? ' running' : '');
    el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', a[0]);
    el.innerHTML = `<div class="icon" style="background:${a[1]}"><svg viewBox="0 0 24 24">${a[2]}</svg></div><i class="run"></i>`;
    dock.appendChild(el);
    items.push({ el, name: a[0], s: 1, rest: 0 });
  });

  let base = 44, MAX = 1.75, px = null, auto = !reduce, t0 = performance.now(), hover = null;
  function measure() {
    base = Math.max(28, Math.min(44, (innerWidth - 60) / 14.5));
    dock.style.setProperty('--base', base + 'px');
    items.forEach(it => { it.el.style.width = it.el.style.height = base + 'px'; });
    items.forEach(it => { const r = it.el.getBoundingClientRect(); it.rest = r.left + r.width / 2; });
  }
  function frame(now) {
    if (auto) {
      const t = (now - t0) / 1000;
      const first = items[0].rest, last = items[items.length - 1].rest;
      px = first + (last - first) * (0.5 - 0.5 * Math.cos(t * 0.75));
    }
    const sigma = base * 1.25;
    let best = null, bestD = 1e9;
    items.forEach(it => {
      const d = px == null ? 1e9 : Math.abs(px - it.rest);
      const target = 1 + (MAX - 1) * Math.exp(-(d * d) / (2 * sigma * sigma));
      it.s += (target - it.s) * (reduce ? 1 : 0.22);
      const w = (base * it.s).toFixed(2) + 'px';
      it.el.style.width = it.el.style.height = w;
      if (d < bestD) { bestD = d; best = it; }
    });
    const show = px != null && bestD < base * 0.75 && !auto ? best : (auto && bestD < base * 0.35 ? best : null);
    if (show) {
      if (hover !== show) { tip.textContent = show.name; hover = show; }
      const r = show.el.getBoundingClientRect();
      tip.style.transform = `translate(${(r.left + r.width / 2 - tip.offsetWidth / 2).toFixed(1)}px, ${(r.top - tip.offsetHeight - 12).toFixed(1)}px)`;
      tip.classList.add('show');
    } else { tip.classList.remove('show'); hover = null; }
    requestAnimationFrame(frame);
  }
  function launch(it) {
    it.el.classList.remove('bounce'); void it.el.offsetWidth; it.el.classList.add('bounce');
    if (it.name !== 'Trash') setTimeout(() => it.el.classList.add('running'), 500);
  }
  function stopAuto() { auto = false; }
  dock.addEventListener('pointermove', e => { stopAuto(); px = e.clientX; });
  dock.addEventListener('pointerleave', () => { px = null; });
  items.forEach(it => {
    it.el.addEventListener('click', () => { stopAuto(); launch(it); });
    it.el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); launch(it); } });
    it.el.addEventListener('focus', () => { stopAuto(); px = it.rest; });
    it.el.addEventListener('blur', () => { if (px === it.rest) px = null; });
  });
  // the demo occasionally launches an app
  let demoTimer = setInterval(() => { if (!auto) return clearInterval(demoTimer); const it = items.find(i => i === hover); if (it) launch(it); }, 3100);

  addEventListener('resize', () => { const p = px; px = null; items.forEach(i => (i.s = 1)); measure(); px = p; });
  measure();
  if (reduce) clearInterval(demoTimer);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
