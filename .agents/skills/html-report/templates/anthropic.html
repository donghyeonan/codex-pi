<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제목</title>
<style>
:root{
  --bg:#FAF9F5; --panel:#F0EEE6; --ink:#141413; --slate:#3D3D3A; --muted:#8A8880; --line:#E3E1D8; --clay:#D97757;
  --serif:"Iowan Old Style","Times New Roman","AppleMyungjo",serif;
  --sans:-apple-system,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:72px 24px 120px}
.eye{font-size:13px;color:#6B6A65}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.15;margin:14px 0 18px}
.lead{font-size:19px;color:var(--slate);margin:0 0 48px}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.3;margin:64px 0 12px}
h3{font-size:18px;margin:36px 0 8px}
p{margin:0 0 18px}
a{color:var(--ink);text-decoration-color:var(--clay)}
b,strong{font-weight:650}
hr{border:0;border-top:1px solid var(--line);margin:48px 0}

/* 근거: 필요한 문장 바로 뒤에 */
figure{margin:28px 0;background:var(--panel);border-radius:14px;padding:20px 22px}
figure svg,figure img{width:100%;height:auto;display:block}
figcaption{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
svg text{fill:var(--slate);font:12px var(--sans)}
.bar{fill:var(--clay)}
blockquote{margin:0;font-family:var(--serif);font-size:18px;line-height:1.7}
table{border-collapse:collapse;width:100%;font-size:14px}
.scroll{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums}
pre{margin:0;overflow-x:auto;font:13px/1.6 var(--mono)}
code{font:.88em var(--mono);background:#E8E6DC;padding:1px 4px;border-radius:3px}
pre code{background:none;padding:0}

.note{border-left:2px solid var(--clay);padding-left:14px;color:var(--slate)}   /* 단서·한계 */
.flow p{margin:0 0 10px}
.comment{margin:28px 0;padding:16px 20px;border-left:3px solid var(--clay);background:var(--panel)}
.comment b{margin-right:6px}
.link{display:block;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:18px 0;text-decoration:none;color:inherit}
.link span{display:block;font-size:13px;color:var(--muted)}
details{margin:12px 0}
summary{cursor:pointer;color:var(--slate)}

@media(max-width:640px){main{padding:40px 16px 80px}h1{font-size:34px}h2{font-size:25px}body{font-size:16px}}
</style>
</head>
<body><main>
<div class="eye">분류 · 날짜</div>
<h1>제목</h1>
<p class="lead">무엇을 왜 쓰는지 두세 줄. 길면 어디부터 읽으면 되는지.</p>

<div class="flow">
<p>1. 큰 이야기를 먼저 던짐.</p>
<p>2. 앞 번호를 받아 풀어 감. 처음 나온 용어는 여기서 쉬운 말로 풂.</p>
<figure>
  <img src="data:image/png;base64,..." alt="원본 캡처가 보여 주는 내용">
  <figcaption>출처</figcaption>
</figure>
<p>3. 숫자는 구체적으로, 필요하면 직접 계산함.</p>
<figure>
  <svg viewBox="0 0 460 48" role="img" aria-label="막대 그래프">
    <text x="112" y="15" text-anchor="end">항목 A</text><rect class="bar" x="120" y="4" width="240" height="14" rx="2"/><text x="366" y="15">120</text>
    <text x="112" y="37" text-anchor="end">항목 B</text><rect class="bar" x="120" y="26" width="120" height="14" rx="2"/><text x="246" y="37">60</text>
  </svg>
  <figcaption>무엇을 보면 되는지 · 출처</figcaption>
</figure>
<p>4. 외국어 자료는 우리말로 요약한 뒤 원문을 붙임.</p>
<figure>
  <blockquote>Original sentence as written. [중략]</blockquote>
  <figcaption>매체, 날짜</figcaption>
</figure>
<a class="link" href="#">기사·자료 제목<span>example.com</span></a>
</div>

<div class="comment"><b>한줄 코멘트.</b>여기까지의 흐름에 대한 해석 몇 문장.</div>

<div class="flow">
<p>5. 다음 흐름도 번호를 이어서 씀.</p>
</div>
</main></body>
</html>
