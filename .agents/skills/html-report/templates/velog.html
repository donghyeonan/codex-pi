<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제목</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#212529; --slate:#495057; --muted:#868E96; --line:#DEE2E6; --surface:#F8F9FA;
  --mint:#12B886; --mint-accent:#20C997; --amber:#F59F00;
  --sans:-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",sans-serif;
  --mono:"Fira Mono",source-code-pro,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 var(--sans);letter-spacing:-.004em;-webkit-font-smoothing:antialiased}
main{max-width:768px;margin:0 auto;padding:64px 24px 120px}
h1{font-size:36px;font-weight:800;line-height:1.45;margin:0 0 16px}
.meta{font-size:13px;color:var(--muted);margin:0 0 24px}
.lead{font-size:18px;color:var(--slate);margin:0 0 48px}
h2{font-size:28px;font-weight:700;line-height:1.45;margin:64px 0 16px}
h3{font-size:20px;font-weight:700;line-height:1.5;margin:32px 0 12px}
p{margin:16px 0}
ul,ol{padding-left:22px}
a{color:var(--mint);text-decoration:none}
a:hover{text-decoration:underline}
hr{height:1px;border:0;background:var(--line);margin:48px 0}

/* 근거: 필요한 문장 바로 뒤에 */
figure{margin:32px 0}
figure img,figure svg{display:block;width:100%;height:auto;border-radius:4px}
figcaption{margin-top:10px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
svg text{fill:var(--slate);font:12px var(--sans)}
.bar{fill:var(--mint)}
blockquote{margin:0;padding:16px 16px 16px 28px;background:var(--surface);border-left:4px solid var(--mint-accent);border-radius:0 4px 4px 0}
blockquote>:first-child{margin-top:0}blockquote>:last-child{margin-bottom:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface);color:var(--slate);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid #E9ECEF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
pre{background:var(--surface);border-radius:4px;padding:16px;margin:0;overflow-x:auto}
pre code{font:14px/1.6 var(--mono);background:none;color:var(--ink);padding:0}
code{font-family:var(--mono);font-size:.92em;background:var(--surface);color:var(--mint);padding:2px 5px;border-radius:3px}

.note{border-left:3px solid var(--amber);padding:2px 0 2px 14px;color:var(--slate)}   /* 단서·한계 */
details{margin:12px 0}
summary{cursor:pointer;color:var(--slate)}

@media(max-width:768px){main{padding:40px 16px 80px}h1{font-size:28px}h2{font-size:24px}body{font-size:16px}}
</style>
</head>
<body><main>
<h1>제목</h1>
<p class="meta">날짜 · 다룬 자료</p>
<p class="lead">무엇을 이야기하는지 한두 문장.</p>

<section id="s1">
  <h2>소제목</h2>
  <p>1. 이 글에서 이야기할 것과 결론.</p>
  <p>2. 앞 번호를 받아 이어 가는 이야기. 근거가 있으면 바로 뒤에 보여 준다.</p>
  <figure>
    <pre><code>근거 코드나 데이터 발췌</code></pre>
    <figcaption>무엇을 보면 되는지 · 출처</figcaption>
  </figure>
  <p>3. 그래서 이 자료가 말하는 것.</p>
  <figure>
    <img src="data:image/png;base64,..." alt="원본 캡처가 보여 주는 내용">
    <figcaption>원본 캡처: 무엇을 보면 되는지 · 출처</figcaption>
  </figure>
  <figure>
    <blockquote><p>원문 대목 그대로. [중략]</p></blockquote>
    <figcaption>저자, 연도 · <a href="#">링크</a></figcaption>
  </figure>
  <p>4. 이어지는 이야기.</p>
  <p class="note">단서나 한계는 필요한 곳에 한 번.</p>
</section>

</main></body>
</html>
